<body>
    <!-- <img src="./img/5_background/first_half_background.png" alt="Hintergrundbild einer Wüste"> -->
    <!-- <div id="newBox"> -->
    <!-- <div id="epl" class="d_flex d_none"> -->
    <!-- <img src="./img/5_background/first_half_background.png" alt=""> -->
    <!-- <div stylde="transform: scaleX(-1) !important;"> -->
    <div class="landscapeScreen">
        <div id="infoScreen" class="infoScreen">
            <p>Bitte Gerät drehen :)</p>
        </div>
    </div>
    <!-- </div> -->
    <div id="startScreen" class="startScreen">
        <h1>El Pollo Loco</h1>
        <div class="instructions">
            <p>Was du tun musst... </p>
            <span>Beseitige Gegner, indem du mit Flaschen auf Sie wirfst. :-)</span><br><br>
            <span>Sammle - je nach Schwierigkeitsgrad - <b>ALLE</b> Coins ein, um gegen den Endgegner
                anzutreten.</span><br><br>
            <span>Besiege den Endgegner und starte Level 2.</span><br><br><br>
        </div>
        <div id="heaviness">
            <span class="">Schwierigkeitsgrad auswählen</span>
            <input type="range" min="0" max="100" value="50" id="heavinessSlider">
            <div class="value"><span id="heavinessSliderValue">50</span>%</div>
        </div>
        <div class="startBtn" id="startBtn" onclick="init(1)" touchstart="init()">
            <img src="./img/buttons/arrow-throw.png" class="startGameBtn">
            <div class="startGameTxt">Start</div>
        </div>
    </div>
    <section id="biggerScreen" class="headSection">
        <canvas id="canvas" width="720" height="480"></canvas>
        <div class="controlsBox" id="controlsBox">
            <!-- <div id="controls"> -->
            <section class="btnContainerTop">
                <div class="blocks">
                    <!-- <img class="gamePlayButtons" src="./img/buttons/info.png" id="btnInfo"> -->
                    <div id="showLevelNbr"></div>
                    <img class="gamePlayButtons" src="./img/buttons/full-screen.png" id="btnWide"
                        onclick="toggleFullScreen()">
                    <img class="gamePlayButtons d_none" src="./img/buttons/closeCross.png" id="btnNormal"
                        onclick="toggleFullScreen()">
                </div>
            </section>
            <section class="btnContainerBottom">
                <div class="blocks">
                    <img class="gamePlayButtons" src="./img/buttons/arrow-left.png" id="btnLeft">
                    <img class="gamePlayButtons" src="./img/buttons/arrow-right.png" id="btnRight">
                </div>
                <!-- </section>
            <section class="btnContainerBottomL"> -->
                <div class="blocks">
                    <img class="gamePlayButtons" src="./img/buttons/arrow-up.png" id="btnJump">
                    <img class="gamePlayButtons" src="./img/buttons/arrow-throw.png" id="btnThrow">
                </div>
            </section>
            <!-- </div> -->
        </div>
    </section>
